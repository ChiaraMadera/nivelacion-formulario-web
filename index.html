<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Formulario de Datos Personales</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <main class="card">
            <form id="formulario" novalidate>
                <fieldset>
                    <legend>Formulario de Datos Personales</legend>

                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" maxlength="50" autocomplete="given-name" />
                    <span class="error-msg" id="error-nombre" role="alert" aria-live="polite"></span>

                    <label for="apellido">Apellido:</label>
                    <input type="text" id="apellido" name="apellido" maxlength="50" autocomplete="family-name" />
                    <span class="error-msg" id="error-apellido" role="alert" aria-live="polite"></span>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" maxlength="100" autocomplete="email" />
                    <span class="error-msg" id="error-email" role="alert" aria-live="polite"></span>

                    <label for="fechaNacimiento">Fecha de Nacimiento:</label>
                    <input type="date" id="fechaNacimiento" name="fechaNacimiento" min="1900-01-01" />
                    <span class="error-msg" id="error-fechaNacimiento" role="alert" aria-live="polite"></span>

                    <label for="paisResidencia">País de Residencia:</label>
                    <input type="text" id="paisResidencia" name="paisResidencia" maxlength="60" autocomplete="country-name" />
                    <span class="error-msg" id="error-paisResidencia" role="alert" aria-live="polite"></span>

                    <button type="submit" class="btn btn-enviar">Enviar</button>

                    <section class="theme-buttons" aria-label="Selector de temas visuales">
                        <button type="button" id="btn-normal" class="btn btn-estilo btn-normal">Estilo Normal</button>
                        <button type="button" id="btn-alto" class="btn btn-estilo btn-alto">Estilo Alto Contraste</button>
                    </section>

                    

                </fieldset>
            </form>
        </main>

        <script src="app.js"></script>
    </body>
</html>
